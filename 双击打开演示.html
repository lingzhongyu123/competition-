const statusLabels = { active: '有效', superseded: '已取代', withdrawn: '已模拟撤回' };
function statusAt(memory, day, withdrawals = []) {
  if (day < memory.day || day < memory.validFrom) return 'not-yet';
  if (withdrawals.some(event => event.memoryId === memory.id && event.day <= day)) return 'withdrawn';
  if (memory.validTo !== null && day >= memory.validTo) return 'superseded';
  return 'active';
}

// This is the replaceable data boundary. Real API failures must not fall back to mock.
function createMockProvider() {
  let withdrawals = [];
  function snapshot(day) {
    if (!days.includes(day)) throw new Error('不支持的演示时间');
    const visible = memories.filter(memory => statusAt(memory, day, withdrawals) !== 'not-yet')
      .map(memory => {
        // Do not reveal a future replacement when viewing earlier history.
        const record = { ...memory, status: statusAt(memory, day, withdrawals) };
        if (record.validTo !== null && record.validTo > day) record.validTo = null;
        return record;
      });
    return structuredClone({
      workspace, day, provenance: 'mock', memories: visible,
      evidence: evidence.filter(item => item.day <= day),
      traces: traces.filter(trace => trace.day <= day),
      events: [...timeline, ...withdrawals.map(event => ({ id: event.id, day: event.day, type: 'withdrawal', title: '模拟撤回一条记忆', detail: '仅影响本次演示的活动视图；没有执行真实删除。', memoryIds: [event.memoryId] }))].filter(event => event.day <= day),
      withdrawals: withdrawals.filter(event => event.day <= day),
      capabilities: { mode: 'mock', read: true, realForget: false, simulatedWithdrawal: true, evaluation: false, dshIntegration: false }
    });
  }
  return {
    mode: 'mock',
    getSnapshot: snapshot,
    withdraw(id, day) {
      if (day !== 14) throw new Error('请在 Day 14 当前视图模拟撤回，历史快照只读');
      const record = snapshot(day).memories.find(memory => memory.id === id);
      if (!record || record.status !== 'active') throw new Error('只能撤回当前有效记忆');
      const event = { id: `mock-withdraw-${withdrawals.length + 1}`, memoryId: id, day, provenance: 'mock', effects: { ui: 'simulated', storage: 'not-performed', index: 'not-performed', cache: 'not-performed', backup: 'unknown' } };
      withdrawals.push(event);
      return structuredClone(event);
    },
    reset() { withdrawals = []; },
    exportSnapshot(day) { return { schemaVersion: 1, exportedAt: new Date().toISOString(), disclaimer: '合成演示数据；不代表真实 API 记录或评测结果', snapshot: snapshot(day) }; }
  };
}

function filterMemories(snapshot, { query = '', kind = 'all', status = 'all' } = {}) {
  const term = query.trim().toLocaleLowerCase();
  return snapshot.memories.filter(memory =>
    (kind === 'all' || memory.kind === kind) &&
    (status === 'all' || memory.status === status) &&
    `${memory.title} ${memory.summary} ${memory.id} ${memory.scope}`.toLocaleLowerCase().includes(term)
  );
}

}
function renderEvaluation() {
  return `<section class="panel"><div class="panel-heading"><div><h2>公开数据准备情况</h2><p>公开任务定义、合成演示与真实评测结果分别标识。</p></div>${tag('无评测成绩','muted-tag')}</div><div class="dataset-grid"><article class="dataset"><span class="eyebrow">LONGMEMEVAL</span><h3>事实、更新与时间推理</h3>${tag('待导入原始样本','amber')}<p>已核验官方字段与题型；原始数据下载受限，尚未选定 question_id。</p><div class="chip-row">${['事实提取','偏好','知识更新','时间推理','拒答'].map(text=>tag(text)).join('')}</div><a href="https://github.com/xiaowu0162/LongMemEval" target="_blank" rel="noreferrer">查看官方说明 ${icon('link',14)}</a></article><article class="dataset"><span class="eyebrow">OSWORLD</span><h3>任务经历与结果核验</h3>${tag('5 条任务定义已读取','blue')}<p>4 条执行任务候选、1 条标记 infeasible 的任务；尚未运行 VM、收集轨迹或评分。</p><div class="chip-row">${tag('LibreOffice Calc')}${tag('执行结果未采集')}</div><a href="https://github.com/xlang-ai/OSWorld" target="_blank" rel="noreferrer">查看官方说明 ${icon('link',14)}</a></article></div></section><section class="panel"><div class="panel-heading"><div><h2>对照实验 · 待运行</h2><p>固定任务、模型、环境和预算；结果就绪后再填入。</p></div></div><div class="table-wrap"><table><thead><tr><th>指标</th><th>Memory OFF</th><th>Memory ON</th><th>证据要求</th></tr></thead><tbody>${[['产物满足规则','文件或 evaluator 结果'],['完成时间与步骤','同预算的执行日志'],['人工介入次数','实际追问与接管事件'],['经验迁移效果','留出任务与适用条件']].map(([metric,requirement])=>`<tr><td>${metric}</td><td>未运行</td><td>未运行</td><td>${requirement}</td></tr>`).join('')}</tbody></table></div><div class="panel-footer">无实测样本，不计算准确率或改善比例。</div></section><section class="panel"><div class="panel-heading"><div><h2>从样本到页面的接入约定</h2><p>开发与讨论所需的最小数据，不要求一次接齐所有接口。</p></div></div><div class="handoff"><div><strong>01 / 原始记录</strong><p>memory_id、session_id、事件时间、原始文本与证据定位。</p></div><div><strong>02 / 使用轨迹</strong><p>trace_id、候选、选中、实际注入、run_id 和执行引用。</p></div><div><strong>03 / 结果边界</strong><p>answer、has_answer 与 evaluator 参考值仅留在评测端。</p></div></div></section>`;
}
function renderInspector(snapshot) {
  const record=snapshot.memories.find(memory=>memory.id===state.selected);
  if(!record)return `<div class="inspector-empty">${empty('选择一条记忆','点击列表或图谱中的记忆，查看其状态和原始证据。')}</div>`;
  const evidence=snapshot.evidence.filter(item=>record.evidenceIds.includes(item.id));
  return `<div class="inspector-heading"><div class="eyebrow">MEMORY INSPECTOR</div><span class="inspector-mark">${icon('layers')}</span></div><div class="inspector-title">${tag(kindLabels[record.kind],record.kind==='strategy'?'purple':'blue')}<h2>${esc(record.title)}</h2><p>${esc(record.summary)}</p></div><div class="inspector-tags">${memoryStatus(record)} ${tag('MOCK','amber')}</div><dl class="metadata"><dt>记忆 ID</dt><dd><code>${esc(record.id)}</code></dd><dt>所在层</dt><dd>${esc(record.layer)}</dd><dt>适用范围</dt><dd>${esc(record.scope)}</dd><dt>有效区间</dt><dd>Day ${record.validFrom} → ${record.validTo!==null?'Day '+record.validTo+'（不含）':'未设结束'}</dd><dt>版本 / 置信度</dt><dd>v${record.version} / 未提供</dd></dl><div class="section-divider"></div><h3 class="inspector-section-title">来源证据 <span>${evidence.length}</span></h3>${evidence.map(item=>`<details class="evidence" id="evidence-${item.id}" ${evidence.length===1?'open':''}><summary><span>Day ${item.day} · ${esc(item.title)}</span>${icon('chevron',14)}</summary><div><span class="role">${esc(item.role)}</span><blockquote>${esc(item.text)}</blockquote><small>${esc(item.origin)}</small><code>${esc(item.session)} / ${esc(item.id)}</code></div></details>`).join('')}${record.supersedes?`<div class="related"><small>取代的旧记忆</small><button class="text-button" data-memory="${record.supersedes}">报名时间倒序 ${icon('arrow',14)}</button></div>`:''}${record.caseIds?`<div class="related"><small>策略来源案例</small>${record.caseIds.map(id=>snapshot.memories.find(memory=>memory.id===id)).filter(Boolean).map(memory=>memoryButton(memory)).join('')}</div>`:''}<div class="inspector-foot">在 Day ${state.day} 的历史快照中查看。<br>来源是合成数据，尚未连接真实后端。</div>`;
}
function notify(text) { $('#toast').textContent=text;$('#toast').classList.add('show');clearTimeout(notify.timer);notify.timer=setTimeout(()=>$('#toast').classList.remove('show'),3500); }
function withdrawDialog(id,snapshot) {
  const memory=snapshot.memories.find(item=>item.id===id);if(!memory)return;
  const dialog=$('#confirm-dialog');dialog.innerHTML=`<form method="dialog"><div class="eyebrow">MOCK ACTION</div><h2>模拟撤回「${esc(memory.title)}」</h2><p>撤回范围仅为这条记忆。其他偏好与历史 trace 保留。</p><div class="inline-note">本次操作只修改内存中的演示状态；不会执行真实删除、更新索引或清理备份。</div><div class="dialog-actions"><button class="secondary" value="cancel">取消</button><button class="primary" value="confirm">确认模拟撤回</button></div></form>`;
  dialog.onclose=()=>{if(dialog.returnValue==='confirm'){try{provider.withdraw(id,state.day);render();notify('已模拟撤回；真实存储与索引未执行任何操作。')}catch(error){notify(error.message)}}};dialog.showModal();
}
function bind(snapshot) {
  document.querySelectorAll('[data-nav]').forEach(button=>button.onclick=()=>navigate(button.dataset.nav));
  document.querySelectorAll('[data-day]').forEach(button=>button.onclick=()=>navigate(state.page,Number(button.dataset.day)));
  document.querySelectorAll('[data-memory]').forEach(button=>button.onclick=()=>{state.selected=button.dataset.memory;render();if(innerWidth<1200)$('#inspector').scrollIntoView({behavior:'smooth',block:'start'})});
  document.querySelectorAll('[data-trace]').forEach(button=>button.onclick=()=>{state.page='traces';state.trace=button.dataset.trace;safeReplaceState(null,'',`#traces?day=${state.day}`);render()});
  document.querySelectorAll('[data-evidence]').forEach(button=>button.onclick=()=>{const memory=snapshot.memories.find(item=>item.evidenceIds.includes(button.dataset.evidence));if(memory){state.selected=memory.id;render();const detail=$('#evidence-'+button.dataset.evidence);if(detail){detail.open=true;detail.scrollIntoView({behavior:'smooth',block:'nearest'})}}});
  document.querySelectorAll('[data-graph]').forEach(button=>button.onclick=()=>{state.graph=button.dataset.graph;render()});
  document.querySelectorAll('[data-withdraw]').forEach(button=>button.onclick=()=>withdrawDialog(button.dataset.withdraw,snapshot));
  if($('#filters'))$('#filters').onsubmit=event=>{event.preventDefault();state.query=$('#query').value;state.kind=$('#kind').value;state.status=$('#status-filter').value;render();$('#query').focus()};
  for(const select of ['#kind','#status-filter'])if($(select))$(select).onchange=()=>$('#filters').requestSubmit();
  if($('#trace-select'))$('#trace-select').onchange=event=>{state.trace=event.target.value;render()};
  $('[data-export]').onclick=()=>{const blob=new Blob([JSON.stringify(provider.exportSnapshot(state.day),null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`memory-console-MOCK-day-${state.day}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('已导出当前模拟快照，文件内包含 MOCK 来源声明。')};
  $('button[data-theme]').onclick=()=>{state.theme=state.theme==='kylin'?'neutral':'kylin';render()};
  $('[data-reset]').onclick=()=>{provider.reset();state.selected='mem-sort-v1';state.trace=null;navigate('memories',1);notify('已恢复初始数据，从 Day 01 开始演示。')};
  $('[data-tour]').onclick=()=>{state.selected='mem-sort-v1';navigate('timeline',1);notify('按 Day 01 → 03 → 07 → 10 → 14 回放；从事件打开记忆与轨迹。')};
}
function render() {
  const snapshot=provider.getSnapshot(state.day);
  if(!snapshot.memories.some(memory=>memory.id===state.selected))state.selected=snapshot.memories[0]?.id;
  document.body.dataset.theme=state.theme;
  const renderers={memories:renderList,graph:renderGraph,timeline:renderTimeline,traces:renderTrace,experience:renderExperience,manage:renderManage,evaluation:renderEvaluation};
  $('#app').innerHTML=`<aside class="sidebar"><div class="brand"><span class="brand-symbol">◈</span><div><strong>麒麟 · 记忆</strong><small>MEMORY CONSOLE</small></div></div><div class="workspace-switch"><span class="workspace-avatar">M</span><div><strong>演示工作区</strong><small>本地合成数据</small></div><span class="status-dot"></span></div><div class="nav-heading">工作台</div><nav aria-label="主导航">${pages.map(([id,label,symbol])=>`<button class="nav-item ${state.page===id?'active':''}" data-nav="${id}" aria-label="${label}" title="${label}" ${state.page===id?'aria-current="page"':''}>${icon(symbol)}<span>${label}</span>${id==='experience'?'<span class="nav-mini">规划</span>':''}</button>`).join('')}</nav><div class="sidebar-bottom"><div class="connection"><span class="offline-dot"></span><div><strong>独立原型</strong><small>DSH / Memory 尚未接入</small></div></div><button data-reset>${icon('clock',16)} 重置演示</button><p>麒麟概念视觉 · 非官方规范</p></div></aside><div class="shell"><header class="topbar"><div class="breadcrumb">工作台 <span>/</span> ${pages.find(([id])=>id===state.page)[1]}</div><div class="topbar-actions">${tag('MOCK 数据模式','amber')}<button class="icon-button" data-theme aria-label="${state.theme==='kylin'?'切换为中性主题':'切换为麒麟概念主题'}" title="切换主题">${icon('sun')}</button><span class="avatar">演</span></div></header><div class="content-shell"><main id="main" tabindex="-1">${top(snapshot)}${renderers[state.page](snapshot)}<div class="demo-footer"><span>模拟时间轴 · 无实测成绩 · 刷新恢复状态</span><button class="text-button" data-tour>从头演示 ${icon('arrow',14)}</button></div></main><aside class="inspector" id="inspector" aria-label="记忆详情">${renderInspector(snapshot)}</aside></div></div>`;
  bind(snapshot);
}
readRoute();window.addEventListener('hashchange',()=>{readRoute();render()});render();

})();</script>
</body>
</html>
